  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="index.html" aria-label="A4 Workshop home">A4 Workshop</a>
        <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="primary-navigation">Menu</button>
        <nav id="primary-navigation" class="primary-navigation" aria-label="Primary navigation">
          <a href="https://a4workshop2027.org/2027/" target="_blank" rel="noopener noreferrer">Home</a>

          <div class="nav-group active">
            <a class="program-link active" aria-current="page" href="program-at-a-glance.html">Program</a>

    </header>
    <main>
      <section class="page-hero"><div class="container"><h1>Program at a Glance</h1></div></section>
      <section class="content-section"><div class="container">
        <figure class="program-overview">
          <figcaption class="visually-hidden">Four-day workshop overview, arranged by morning, lunch, afternoon, and evening.</figcaption>
          <div class="program-overview-scroll" tabindex="0" role="region" aria-label="Program at a Glance schedule. Scroll horizontally to view all dates.">
            <table class="program-overview-table">
              <thead>
                <tr>
                  <th scope="col"><span class="visually-hidden">Time of day</span></th>
                  <th scope="col">Jan 18<span>Mon</span></th>
                  <th scope="col">Jan 19<span>Tue</span></th>
                  <th scope="col">Jan 20<span>Wed</span></th>
                  <th scope="col">Jan 21<span>Thu</span></th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <th scope="rowgroup" rowspan="3">Morning</th>
                  <td class="schedule-empty" rowspan="3"></td>
                  <td>Opening</td>
                  <td>Plenary</td>
                  <td rowspan="3">Discussion</td>
                </tr>
                <tr>
                  <td>Plenary</td>
                  <td rowspan="2">Invited Talks</td>
                </tr>
                <tr>
                  <td>Invited Talks</td>
                </tr>
                <tr class="schedule-lunch">
                  <th scope="row">Lunch</th>
                  <td colspan="4">Lunch Break</td>
                </tr>
                <tr>
                  <th scope="rowgroup" rowspan="3">Afternoon</th>
                  <td rowspan="3">Lab Tour</td>
                  <td>Invited Talks</td>
                  <td rowspan="2">Invited Talks</td>
                  <td class="schedule-empty" rowspan="3"></td>
                </tr>
                <tr>
                  <td>Poster Session</td>
                </tr>
                <tr>
                  <td>Panel Discussion</td>
                  <td>Excursion</td>
                </tr>
                <tr class="schedule-evening">
                  <th scope="row">Evening</th>
                  <td class="schedule-empty"></td>
                  <td>Reception</td>
                  <td>Banquet</td>
                  <td class="schedule-empty"></td>
                </tr>
              </tbody>
            </table>
          </div>
        </figure>
      </div></section>
    </main>
    <footer class="site-footer"><div class="container">A4 Workshop</div></footer>
  </body>
